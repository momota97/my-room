<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Momota's Room</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">

<style>
    /* 全体設定 */
    body {
        font-family: 'Hachi Maru Pop', cursive, sans-serif;
        color: #ff8fc5;
        margin: 0;
        min-height: 100vh;
        background-color: #fff0f9;
        background-image: radial-gradient(#ffffff 15%, transparent 15%),
                          radial-gradient(#ffffff 15%, transparent 15%);
        background-position: 0 0, 20px 20px;
        background-size: 40px 40px;
    }

    .site-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 1. タイトルエリア */
    .title-card {
        background: rgba(255, 254, 255, 0.9);
        padding: 40px 30px;
        text-align: center;
        width: 100%;
        max-width: 650px;
        margin-bottom: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        box-sizing: border-box;
    }

    .title-card h1 {
        margin: 0;
        font-size: 2.2em;
    }

    /* 2. 下部2カラムエリア */
    .bottom-columns {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 650px;
        justify-content: center;
    }

    /* スマホ表示用レスポンシブ対応 */
    @media (max-width: 600px) {
        .bottom-columns {
            flex-direction: column;
        }
    }

    .left-col, .right-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* 共通カードスタイル */
    .info-card {
        position: relative; /* 重ねる装飾の基準位置設定 */
        background: rgba(255, 254, 255, 0.9);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        box-sizing: border-box;
    }

    /* 🎀 右上リボン装飾 */
    .ribbon-deco {
        position: absolute;
        top: -5px;
        right: -25px;
        width: 100px;
        height: auto;
        z-index: 10;
        pointer-events: none;
    }

    /* 🤍 右下ワッペン装飾 */
    .wappen-deco {
        position: absolute;
        bottom: -20px;
        right: 15px;
        width: 90px;
        height: auto;
        z-index: 10;
        pointer-events: none;
    }

    /* プロフィール表（上部） */
    .profile-table {
        width: 100%;
        border-collapse: collapse;
    }
    .profile-table th, .profile-table td {
        padding: 8px 4px;
        border-bottom: 1px dashed #ffe0ef;
        font-size: 0.85em;
    }
    .profile-table th {
        width: 35%;
        color: #ff8fc5;
        text-align: left;
    }
    .profile-table td {
        color: #666;
    }

    /* 吹き出し風カード */
    .speech-card {
        position: relative;
        background: rgba(255, 254, 255, 0.9);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        box-sizing: border-box;
        color: #ff8fc5;
        font-size: 0.85em;
        line-height: 1.5;
    }
    .speech-card::after {
        content: '';
        position: absolute;
        right: -12px;
        top: 25px;
        border-width: 8px 0 8px 12px;
        border-style: solid;
        border-color: transparent transparent transparent rgba(255, 254, 255, 0.9);
    }

    /* 右側：画像エリア */
    .profile-img-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 250px;
    }

    /* 静止画像設定 */
    .profile-img {
        width: 100%;
        max-width: 300px;
        height: auto;
        display: block;
        border-radius: 8px;
    }

    /* 詳細プロフィールエリア */
    .detail-container {
        width: 100%;
        max-width: 650px;
        margin-top: 35px;
        text-align: center;
        box-sizing: border-box;
    }

    .gallery-divider {
        width: 100%;
        border-top: 2px dashed #ff8fc5;
        margin-bottom: 25px;
    }

    .detail-container h2 {
        font-size: 1.3em;
        margin: 0 auto 25px auto;
        text-align: center;
        display: inline-block;
        padding: 8px 25px;
        background: rgba(255, 254, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        color: #ff8fc5;
    }

    /* Detailテーブルの文字配置設定 */
    .detail-table th {
        width: 35%;
        text-align: left;
    }

    .detail-table td {
        text-align: center;
    }

    .detail-table tr:last-child th,
    .detail-table tr:last-child td {
        border-bottom: none;
    }

    /* 詳細コメント欄 */
    .detail-comment {
        text-align: left;
        padding-top: 15px;
        margin-top: 10px;
        border-top: 1px dashed #ffe0ef;
        color: #666;
        font-size: 0.85em;
        line-height: 1.7;
    }
    .detail-comment p {
        margin: 0;
    }
    
    /* もどるボタン */
    .back-btn {
        display: block;
        margin: 35px auto 0;
        max-width: 140px;
        text-align: center;
        padding: 8px 15px;
        background-color: #ff8fc5;
        color: white;
        text-decoration: none;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.85em;
        transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55), background-color 0.2s;
    }
    .back-btn:hover {
        background-color: #ffb6c1;
        transform: scale(1.08) translateY(-2px);
    }
</style>
</head>
<body>
    <div class="site-container">

        <!-- 1. タイトルエリア -->
        <div class="title-card">
            <h1>｡.୨୧ About Me ୨୧.｡</h1>
        </div>

        <!-- 2. 下部2カラムエリア -->
        <div class="bottom-columns">

            <!-- 左カラム（プロフ ＋ 吹き出し） -->
            <div class="left-col">
                <div class="info-card">
                    <!-- 🎀 右上リボン画像 -->
                    <img src="ornament_2.png" class="ribbon-deco" alt="リボン">

                    <table class="profile-table">
                        <tr>
                            <th>名前</th>

                            <th>誕生日</th>

                        <tr>
                            <th>髪色</th>

                    </table>
                </div>

                <div class="speech-card">

            <!-- 右カラム（画像） -->
            <div class="right-col">
                <div class="profile-img-container">
                    <img src="momota.jpg" class="profile-img" alt="推しの画像">

        </div>

        <!-- 2.5 詳細プロフィールエリア -->
        <div class="detail-container">
            <div class="gallery-divider"></div>

            <h2>☁︎⊹⁺˖ Detail ˖⁺⊹☁︎</h2>

            <div class="info-card">
                <!-- 🤍 右下ワッペン画像 -->
                <img src="ornament_3.png" class="wappen-deco" alt="ワッペン">

                <table class="profile-table detail-table">
                    <tr>
                        <th>血液型</th>

                    </tr>
                    <tr>
                        <th>性格</th>

                    </tr>
                    <tr>
                        <th>趣味</th>

                    </tr>
                    <tr>
                        <th>嫌いなもの</th>

                    </tr>
                    <tr>
                        <th>好きな作家</th>
                        <td>伊藤計劃</td>
                    </tr>
                </table>

                <div class="detail-comment">
                    <p>
                        好きなものを好きなときに描きます。<br>
                        対人が苦手なので交流できない💦<br>
                        SNSは精神に異常を来すのでほとんど見ません😌<br>
                    </p>
                </div>
            </div>
        </div>

        <!-- 3. もどるボタン -->
        <a href="home.html" class="back-btn">← もどる</a>

    </div>
</body>
</html>
